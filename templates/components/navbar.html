<nav class="navbar">
    <div class="navbar-container">
        <a href="{% url 'landing' %}" class="navbar-brand">
            Workshop System
        </a>
        
        <div class="navbar-menu">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="navbar-link">Dashboard</a>
                <a href="{% url 'requests' %}" class="navbar-link">Requests</a>
                <a href="{% url 'create_request' %}" class="navbar-link navbar-link-primary">Create Request</a>

                <button formmethod="post" formaction="{% url 'logout' %}"

                <a href="{% url 'login' %}" class="navbar-link">Login</a>

            {% endif %}
        </div>
        
        <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle navigation">
            <span class="navbar-toggle-icon"></span>
            <span class="navbar-toggle-icon"></span>
            <span class="navbar-toggle-icon"></span>
        </button>
