{% load static %}
<div class="empty-state">
    <div class="empty-state-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
    </div>
    <h3 class="empty-state-title">{{ title|default:"No items found" }}</h3>
    <p class="empty-state-description">{{ description|default:"There are no items to display at this time." }}</p>
    {% if action_url and action_text %}
        <a href="{{ action_url }}" class="btn btn-primary">{{ action_text }}</a>
    {% endif %}
</div>
